name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend-unit:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt
      # API tests exercise Uvicorn + MongoDB. Keep this fast regression gate
      # hermetic; service-backed coverage is selected with the integration
      # marker when that environment is available.
      - run: pytest -q tests -m "not integration"

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      # The repository uses Yarn 1 (see packageManager/yarn.lock). Installing it
      # explicitly avoids relying on whatever happens to be preinstalled on a
      # runner and makes CI reproducible.
      - run: npm install --global yarn@1.22.22
      - run: yarn install --frozen-lockfile
      - run: yarn build
        env:
          CI: "true"
