name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend-unit:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt
      # test_occ_backend.py and test_campaign.py exercise a live API and need
      # MongoDB/Uvicorn. Keep the fast regression gate hermetic; integration
      # coverage belongs in a service-backed job.
      - run: pytest -q tests --ignore=tests/test_occ_backend.py --ignore=tests/test_campaign.py

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      # The repository uses Yarn 1 (see packageManager/yarn.lock). Installing it
      # explicitly avoids relying on whatever happens to be preinstalled on a
      # runner and makes CI reproducible.
      - run: npm install --global yarn@1.22.22
      - run: yarn install --frozen-lockfile
      - run: yarn build
        env:
          CI: "true"
